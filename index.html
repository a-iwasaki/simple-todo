<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODOアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <form id="new-form" class="new-form">
      <input id="new-input" type="text" maxlength="200" placeholder="やることを入力"
             aria-label="新しいタスク" autocomplete="off">
      <button type="submit" class="primary">追加</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>
    <noscript><p class="error">このアプリを使うには JavaScript を有効にしてください。</p></noscript>

    <div class="filters" role="group" aria-label="表示の絞り込み">
      <button type="button" data-filter="all" aria-pressed="true">すべて</button>
      <button type="button" data-filter="active" aria-pressed="false">未完了</button>
      <button type="button" data-filter="completed" aria-pressed="false">完了</button>
    </div>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="footer">
      <span id="count" aria-live="polite"></span>
      <button type="button" id="clear">完了済みを削除</button>
    </footer>
  </main>

  <template id="item-template">
    <li class="item">
      <input type="checkbox" class="toggle">
      <span class="text"></span>
      <input type="text" class="edit-input" maxlength="200" aria-label="タスクを編集" hidden>
      <button type="button" class="edit">編集</button>
      <button type="button" class="delete">削除</button>
    </li>
  </template>

  <script src="todo.js"></script>
  <script src="app.js"></script>
</body>
</html>
